{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
      integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
      integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
      crossorigin="anonymous"
    ></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <style>
      body {
        background-color: black;
      }

      nav {
        background-color: rgba(244, 243, 91, 255);
        max-height: 125px;
      }
      .brand {
        width: 250px;
        height: 125px;
        border: 15px solid green;
        border-radius: 70px;
      }
      .navbar {
        display: flex;
        width: 100%;
        padding-right: 50px;
        font-size: 18px;
        font-weight: 500;
        text-align: center;
        border: 10px solid green;
      }

      .fixed-top {
        position: fixed;
        top: 0;
        width: 100%;
        z-index: 1030;
      }

      .navbar a {
        text-decoration: none;
        color: green;
      }
      .navbar button {
        border: none;
        background-color: rgba(244, 243, 91, 255);
        color: green;
      }
      .navbar-brand {
        margin-right: auto;
      }
      .navbar-item {
        margin-left: 40px;
        margin-right: 0px;
      }

      .navbar-item:hover {
        transform: scale(1.1);
        transition: 0.3s ease-in-out;
      }

      .cart {
        margin-top: 10px;
        border: 5px solid green;
        padding: 10px 15px 10px 15px;
        color: green;
        background-color: rgb(254, 166, 4);
        border-radius: 30%;
      }
      .cart span {
        margin-left: 5px;
        font-size: 20px;
        font-weight: 600;
        background-color: green;
        color: rgba(244, 243, 91, 255);
        border: 1px solid green;
        border-radius: 50%;
        padding: 0px 8px 1px 8px;
      }

      .carttab {
        width: 400px;
        background-color: black;
        color: rgba(244, 243, 91, 255);
        position: fixed;
        inset: 125px 0 0 auto;
        display: grid;
        grid-template-rows: 70px 1fr 70px;
        z-index: 1030;
        transition: 0.3s;
        border: 5px solid yellow;
      }

      body.showcart .carttab {
        inset: 125px 0 0 auto;
      }

      .carttab h1 {
        padding-top: 8px;
        padding-left: 20px;
        margin: 0;
        font-weight: 800;
        background-color: rgba(244, 243, 91, 255);
        color: black;
        font-family: cursive;
        margin-bottom: 0px;
      }

      .carttab .btn {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        margin-left: -13px;
        margin-bottom: -7px;
      }

      .carttab .btn button {
        border: none;
        font-family: Poppins;
        font-weight: 500;
        font-size: 20px;
        cursor: pointer;
        width: 107%;
      }

      .close {
        background-color: orange;
      }

      .proceed {
        background-color: rgb(2, 180, 2);
      }

      .carttab .btn button:hover {
        background-color: rgba(244, 243, 91, 255);
      }

      .listcart {
        padding-left: 5px;
      }

      .listcart .item img {
        width: 100%;
      }

      .listcart .item {
        display: grid;
        grid-template-columns: 70px 150px 50px 1fr;
        gap: 8px;
        text-align: center;
        align-items: center;
        padding-bottom: 5px;
        padding-top: 5px;
      }

      .listcart .quantity span {
        display: inline-block;
        width: 25px;
        height: 25px;
        background-color: rgba(244, 243, 91, 255);
        color: black;
        border-radius: 50%;
        cursor: pointer;
        font-size: 15px;
        font-weight: 600;
      }

      .listcart .quantity span:nth-child(2) {
        background-color: transparent;
        color: rgba(244, 243, 91, 255);
      }

      .listcart .item:nth-child(even) {
        background-color: rgba(104, 104, 104, 0.286);
      }

      .listcart {
        overflow: auto;
      }

      .listcart::-webkit-scrollbar {
        width: 0;
      }

      .searchdiv {
        background-color: rgba(244, 243, 91, 255);
        height: 50px;
        padding: 10px 0 0 0;
        width: 100%;
        display: none;
        transition: 0.5s ease-in-out;
        margin-top: 125px;
        position: fixed;
        top: 0;
        z-index: 1030;
      }
      .sbtn {
        display: block;
        transition: 0.5s ease-in-out;
      }
      .searchbox {
        background-color: rgba(244, 243, 91, 255);
        margin: 0 8% 0 8%;
      }
      .searchbox input {
        width: 85%;
        background-color: rgba(244, 243, 91, 255);
        border: none;
        padding-left: 50px;
        font-size: 20px;
        border-bottom: 1px solid green;
      }
      .searchbox button {
        width: 5%;
        background-color: rgba(244, 243, 91, 255);
        border: none;
        font-size: 20px;
        font-weight: 500;
        color: green;
      }
      .resultbox {
        position: absolute;
        left: 0;
        right: 0;
        background: rgba(244, 243, 91, 255);
        border-bottom: 3px solid green;
        border-radius: 0 0 10px 10px;
        display: block;
        width: 100%;
      }
      .resultbox ul {
        padding-left: 150px;
        padding-top: 5px;
        padding-bottom: 5px;
        font-size: 18px;
        height: 100%;
      }
      .resultbox ul:hover {
        background-color: green;
      }

      .container {
        margin-top: 125px;
        max-width: 920px;
        margin-left: 20px;
        color: rgba(244, 243, 91, 255);
      }

      .container img {
        margin-top: 10px;
        height: 450px;
        width: 900px;
        border: 5px solid rgba(244, 243, 91, 255);
        border-radius: 10px;
      }

      .container span {
        display: flex;
        justify-content: space-between;
      }

      .container button {
        background-color: rgb(2, 180, 2);
        border-radius: 20px;
        width: 300px;
        font-weight: 500;
        margin-top: 5px;
        margin-bottom: 5px;
      }
    </style>
  </head>
  <body>
    <!-- navbar -->
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
      <a href="{% url 'home' %}" class="navbar-brand">
        <img src="{% static 'Logobg.jpg' %}" alt="" class="brand"
      /></a>
      <a href="{% url 'home' %}" class="navbar-item">Home</a>
      <button class="navbar-item sbtn" id="sbtn">
        <i class="fa-solid fa-search" onclick="search()"></i>
      </button>
      <a href="" class="navbar-item"><i class="fa-regular fa-user"></i></a>
      <button class="iconcart navbar-item">
        <p class="cart" id="count">
          <i class="fa-solid fa-cart-shopping"></i><span>0</span>
        </p>
      </button>
    </nav>

    <!-- Cart -->

    <div class="carttab">
      <h1>Your Cart</h1>
      <div class="listcart">
        <div class="item">
          <div class="image">
            <img src="{% static 'burgers.jpg' %}" alt="" />
          </div>
          <div class="name">Burger</div>
          <div class="price">₹ 199</div>
          <div class="quantity">
            <span class="minus">-</span>
            <span>1</span>
            <span class="plus">+</span>
          </div>
        </div>
      </div>
      <div class="btn">
        <button class="close">Close</button>
        <button class="proceed">Proceed</button>
      </div>
    </div>

    <!-- search -->
    <div class="searchdiv container-fluid" id="searchdiv">
      <form class="searchbox" action="">
        <input type="text" id="inputbox" placeholder="Search here..." />
        <button type="submit" class="search button">
          <i class="fa-solid fa-search"></i>
        </button>
        <button type="button" class="searchbutton" onclick="searchclose()">
          <i class="fa-solid fa-xmark"></i></button
        ><br />
        <div class="resultbox" id="resultbox">
          <ul></ul>
        </div>
      </form>
    </div>

    <div class="container mt-5">
      <h1>Search Results</h1>
      <div class="row">
        {% for product in products %}
        <div class="col-sm-4">
          <div class="card">
            <img
              src="{{ product.image.url }}"
              class="card-img-top"
              alt="{{ product.name }}"
            />
            <div class="card-body">
              <h5 class="card-title">{{ product.name }}</h5>
              <p class="card-text">{{ product.description }}</p>
              <p class="card-text">₹ {{ product.price }}</p>
              <a
                href="{% url 'viewproduct' product.id %}"
                class="btn btn-primary"
                >View Details</a
              >
            </div>
          </div>
        </div>
        {% empty %}
        <p>No products found.</p>
        {% endfor %}
      </div>
    </div>

    <script>
      function search() {
        document.getElementById("searchdiv").style.display = "block";
        document.getElementById("sbtn").style.display = "none";
      }
      function searchclose() {
        document.getElementById("searchdiv").style.display = "none";
        document.getElementById("sbtn").style.display = "block";
      }
    </script>
  </body>
</html>
